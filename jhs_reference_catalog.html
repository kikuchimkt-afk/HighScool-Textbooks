<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学参考書一覧（表紙ノートリミング）</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: #0a0a12;
            min-height: 100vh;
            color: #e8e8ed;
        }
        .bg-layer { position: fixed; inset: 0; z-index: 0; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(1.1); }
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.75));
        }
        .wrap { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
        .nav-top {
            margin-bottom: 1.5rem;
        }
        .nav-top a {
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            font-size: 0.88rem;
        }
        .nav-top a:hover { color: rgba(255,255,255,0.85); }
        h1 {
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }
        .sub {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.38);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .tabs {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            padding: 0.45rem 1.1rem;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.55);
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab-btn.active {
            background: rgba(255,255,255,0.14);
            color: #fff;
            border-color: rgba(255,255,255,0.28);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.15);
        }
        .card a { text-decoration: none; color: inherit; display: block; }
        .cover-frame {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-frame img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
        }
        .card-body { padding: 0.85rem 1rem 1.1rem; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.35rem; line-height: 1.35; }
        .card-desc { font-size: 0.72rem; color: rgba(255,255,255,0.38); line-height: 1.45; }
        .card-cat {
            font-size: 0.65rem;
            color: rgba(180, 230, 200, 0.85);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        @media (max-width: 520px) {
            .cover-frame { height: 260px; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"><img src="images/portal_bg.png" alt="" loading="eager"></div>
    <div class="bg-overlay"></div>
    <div class="wrap">
        <div class="nav-top">
            <a href="index.html">← ポータルに戻る</a>
        </div>
        <h1>中学参考書一覧</h1>
        <p class="sub">表紙画像はトリミングせず、枠内に全体が入るように表示しています（<code style="font-size:0.8em;opacity:0.7">object-fit: contain</code>）。</p>

        <div class="tabs" id="tabs">
            <button type="button" class="tab-btn active" data-cat="all">すべて</button>
            <button type="button" class="tab-btn" data-cat="jmath">数学</button>
            <button type="button" class="tab-btn" data-cat="jsci">理科</button>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const CAT_LABEL = { jmath: '数学', jsci: '理科' };
        const books = [
            { id: 'jhs_iwork_math1', cat: 'jmath', title: 'iワーク 中1数学', desc: '啓林館「未来へひろがる数学1」本冊・解答・iワークプラス', cover: 'images/jhs_iwork_math1_cover.png', toc: 'jhs_iwork_math1_toc.html' },
            { id: 'jhs_iwork_math2', cat: 'jmath', title: 'iワーク 中2数学', desc: '啓林館「未来へひろがる数学2」本冊・解答・iワークプラス', cover: 'images/jhs_iwork_math2_cover.png', toc: 'jhs_iwork_math2_toc.html' },
            { id: 'jhs_iwork_math3', cat: 'jmath', title: 'iワーク 中3数学', desc: '啓林館「未来へひろがる数学3」本冊・解答・iワークプラス', cover: 'images/jhs_iwork_math3_cover.png', toc: 'jhs_iwork_math3_toc.html' },
            { id: 'jhs_iwork_science1', cat: 'jsci', title: 'iワーク 中1理科', desc: '本冊・解答解説・iワークプラスをまとめた中学生向け教材', cover: 'images/jhs_iwork_science1_cover.jpg', toc: 'jhs_iwork_science1_toc.html' },
            { id: 'jhs_teiki_science1', cat: 'jsci', title: '定期テスト対策ワーク 理科 中1', desc: '啓林館 定期テスト対策ワーク（中1理科）', cover: 'images/jhs_teiki_science1_cover.jpg', toc: 'jhs_teiki_science1_toc.html' },
            { id: 'jhs_teiki_science2', cat: 'jsci', title: '定期テスト対策ワーク 理科 中2', desc: '啓林館 定期テスト対策ワーク（中2理科）', cover: 'images/jhs_teiki_science2_cover.jpg', toc: 'jhs_teiki_science2_toc.html' },
            { id: 'jhs_teiki_science3', cat: 'jsci', title: '定期テスト対策ワーク 理科 中3', desc: '啓林館 定期テスト対策ワーク（中3理科）', cover: 'images/jhs_teiki_science3_cover.jpg', toc: 'jhs_teiki_science3_toc.html' },
            { id: 'jhs_iwork_science2', cat: 'jsci', title: 'iワーク 中2理科', desc: '本冊・解答解説・iワークプラスをまとめた中学生向け教材', cover: 'images/jhs_iwork_science2_cover.jpg', toc: 'jhs_iwork_science2_toc.html' },
            { id: 'jhs_iwork_science3', cat: 'jsci', title: 'iワーク 中3理科', desc: '本冊・解答解説・iワークプラスをまとめた中学生向け教材', cover: 'images/jhs_iwork_science3_cover.jpg', toc: 'jhs_iwork_science3_toc.html' }
        ];

        const grid = document.getElementById('grid');

        function render(cat) {
            const list = cat === 'all' ? books : books.filter(b => b.cat === cat);
            grid.innerHTML = '';
            list.forEach((book) => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <a href="${book.toc}">
                        <div class="cover-frame">
                            <img src="${book.cover}" alt="" loading="lazy" onerror="this.style.opacity=0.25;this.alt='表紙なし';">
                        </div>
                        <div class="card-body">
                            <div class="card-cat">${CAT_LABEL[book.cat]}</div>
                            <div class="card-title">${book.title}</div>
                            <div class="card-desc">${book.desc}</div>
                        </div>
                    </a>`;
                grid.appendChild(card);
            });
        }

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                render(btn.dataset.cat);
            });
        });

        render('all');
    </script>
</body>
</html>
