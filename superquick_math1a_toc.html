<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperQuick 数IA | 目次</title>
    <meta name="description" content="高校参考書（SuperQuick 数IA）目次ポータル。">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewer.css">
    <style>
        .page-bg {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 4rem;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .toc-header {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .toc-header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .toc-header p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }
        .toc-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .toc-category-label {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffd700;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 0.4rem;
        }
        /* Chapter accordion */
        .chapter-block {
            margin-bottom: 12px;
        }
        .chapter-header {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s;
            text-decoration: none;
            color: #fff;
        }
        .chapter-header:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .chapter-header .ch-title {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .chapter-header .ch-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ch-page-badge {
            background: rgba(255,255,255,0.15);
            padding: 0.2rem 0.7rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-family: monospace;
        }
        .ch-toggle {
            font-size: 1.2rem;
            transition: transform 0.3s;
            color: rgba(255,255,255,0.5);
        }
        .chapter-block.open .ch-toggle {
            transform: rotate(90deg);
            color: #ffd700;
        }
        /* Subsection list */
        .subsection-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding-left: 0;
        }
        .chapter-block.open .subsection-list {
            max-height: 4000px;
        }
        .sub-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 1rem 0.65rem 2rem;
            text-decoration: none;
            color: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .sub-item:hover {
            background: rgba(79,172,254,0.12);
            color: #fff;
            padding-left: 2.4rem;
        }
        .sub-item .sub-num {
            background: rgba(79,172,254,0.2);
            color: #4facfe;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .sub-item .sub-title {
            flex: 1;
        }
        .sub-item .sub-page {
            font-size: 0.8rem;
            opacity: 0.6;
            font-family: monospace;
        }
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-to-home:hover {
            color: #fff;
        }
    </style>
</head>
<body class="page-bg">
    <a href="index.html" class="back-to-home">
        <svg style="width:20px;height:20px" viewBox="0 0 24 24">
            <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
        </svg>
        ホームへ戻る
    </a>

    <header class="toc-header">
        <h1>SuperQuick 数IA</h1>
        <p>（全288ページ・カラー版）全166項目</p>
    </header>

    <main class="toc-container">
        <div id="toc-list"></div>
    </main>

    <script src="js/hs_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listEl = document.getElementById('toc-list');
            const data = hsData.superquick_math1a;
            if (!data || !data.chapters) return;

            const viewerBase = 'superquick_math1a_viewer.html?book=superquick_math1a';
            let html = '';
            
            // 数学Iと数学Aの境目
            const mathAStart = 'chap6';
            let inMathA = false;

            html += '<div class="toc-category-label">数学Ⅰ / 全体</div>';

            data.chapters.forEach((ch, ci) => {
                if (ch.id === mathAStart && !inMathA) {
                    inMathA = true;
                    html += '<div class="toc-category-label">数学A</div>';
                }
                if (ch.id === 'answers') {
                    html += '<div class="toc-category-label">解答</div>';
                }

                const hasSub = ch.subsections && ch.subsections.length > 0;
                
                html += `<div class="chapter-block" data-chapter="${ci}">`;
                html += `<div class="chapter-header" data-link="${viewerBase}&section=${ch.id}&page=1">`;
                html += `  <span class="ch-title">${ch.title}</span>`;
                html += `  <span class="ch-meta">`;
                html += `    <span class="ch-page-badge">p.${ch.start}</span>`;
                if (hasSub) {
                    html += `    <span class="ch-toggle">▶</span>`;
                }
                html += `  </span>`;
                html += `</div>`;

                if (hasSub) {
                    html += '<div class="subsection-list">';
                    ch.subsections.forEach(sub => {
                        const link = `${viewerBase}&section=${ch.id}&page=${sub.page}`;
                        html += `<a href="${link}" class="sub-item">`;
                        html += `  <span style="display:flex;align-items:center">`;
                        html += `    <span class="sub-num">${sub.num}</span>`;
                        html += `    <span class="sub-title">${sub.title}</span>`;
                        html += `  </span>`;
                        html += `  <span class="sub-page">p.${sub.page}</span>`;
                        html += `</a>`;
                    });
                    html += '</div>';
                }

                html += '</div>';
            });

            listEl.innerHTML = html;

            // Toggle chapters
            document.querySelectorAll('.chapter-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const block = header.closest('.chapter-block');
                    const subList = block.querySelector('.subsection-list');
                    if (subList) {
                        e.preventDefault();
                        block.classList.toggle('open');
                    } else {
                        // No subsections: navigate directly
                        window.location.href = header.dataset.link;
                    }
                });
            });
        });
    </script>
</body>
</html>
