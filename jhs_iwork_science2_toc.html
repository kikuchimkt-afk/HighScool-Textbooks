            <div class="toc-unit-static">本冊（ワーク）</div>

            <div class="toc-unit-static">本冊 解答解説</div>
            <p class="toc-section-note">目次の番号は解答冊子の<strong>印刷ページ</strong>です。中2の解答PDFは<strong>先頭から欠けなく収録</strong>されており、印刷ページ＝PDF内ページです。全体の p.234 からの対応は <strong>233 + 印刷（PDF）p</strong> です（中3のように復習分の省略はありません）。</p>

    <script>
        const tocSource = {"contents": [{"unit": "1年の復習", "chapters": [{"no": 1, "title": "いろいろな生物とその共通点", "workbook_page": "4-7"}, {"no": 2, "title": "活きている地球", "workbook_page": "8-11"}, {"no": 3, "title": "身のまわりの物質", "workbook_page": "12-15"}, {"no": 4, "title": "光・音・力による現象", "workbook_page": "16-19"}]}, {"unit": "生命（生物の体のつくりとはたらき）", "chapters": [{"no": 5, "title": "生物の体をつくるもの", "sections": ["生物と細胞"], "workbook_page": "20-23"}, {"no": 6, "title": "光合成と呼吸", "sections": ["光合成", "光合成と呼吸"], "workbook_page": "24-27"}, {"no": 7, "title": "根と茎のつくり", "sections": ["根と茎のつくりとはたらき"], "workbook_page": "30-33"}, {"no": 8, "title": "葉のつくりとはたらき", "sections": ["葉の細胞のつくり", "吸い上げた水のゆくえ"], "workbook_page": "34-37"}, {"no": 9, "title": "栄養分をとり入れるしくみ", "sections": ["栄養分をとり入れるしくみ"], "workbook_page": "40-43"}, {"no": 10, "title": "動物の呼吸", "sections": ["呼吸と排出", "物質を運ぶしくみ"], "workbook_page": "44-47"}, {"no": 11, "title": "動物の行動のしくみ", "workbook_page": "48-51"}]}, {"unit": "地球（地球の大気と天気の変化）", "chapters": [{"no": 12, "title": "大気の中ではたらく力", "sections": ["圧力", "大気圧"], "workbook_page": "72-75"}, {"no": 13, "title": "気象観測", "sections": ["大気のようす"], "workbook_page": "76-79"}, {"no": 14, "title": "雲のでき方", "sections": ["大気中の水の変化"], "workbook_page": "82-85"}, {"no": 15, "title": "空気中にふくまれる水蒸気の量", "sections": ["空気中にふくまれる水蒸気の量", "空気の湿りけ"], "workbook_page": "86-89"}, {"no": 16, "title": "気圧配置と天気の変化", "sections": ["風がふくしくみ", "気団と前線", "日本付近の低気圧と前線"], "workbook_page": "94-97"}, {"no": 17, "title": "大気の動き", "sections": ["前線の通過と天気の変化", "地球規模での大気の動き"], "workbook_page": "98-101"}, {"no": 18, "title": "日本の天気", "sections": ["陸と海の間の大気の動き", "日本の四季の天気"], "workbook_page": "104-107"}]}, {"unit": "物質（化学変化と原子・分子）", "chapters": [{"no": 19, "title": "物質の分解", "sections": ["物質を加熱したときの変化", "水溶液に電流を流したときの変化"], "workbook_page": "124-127"}, {"no": 20, "title": "物質の成り立ち", "sections": ["物質のもとになる粒子", "物質を表す記号"], "workbook_page": "128-131"}, {"no": 21, "title": "物質どうしが結びつく変化", "sections": ["物質どうしが結びつく変化"], "workbook_page": "136-139"}, {"no": 22, "title": "酸化と還元", "sections": ["物質が酸素と結びつく変化", "酸化物から酸素をとり除く変化"], "workbook_page": "140-143"}, {"no": 23, "title": "化学変化と熱の出入り", "sections": ["化学変化と熱の出入り"], "workbook_page": "144-147"}, {"no": 24, "title": "化学変化の前後の物質の質量", "sections": ["化学変化の前後の物質の質量"], "workbook_page": "152-155"}, {"no": 25, "title": "反応する物質どうしの質量の割合", "sections": ["反応する物質どうしの質量の割合"], "workbook_page": "156-159"}]}, {"unit": "エネルギー（電流とその利用）", "chapters": [{"no": 26, "title": "回路と電流・電圧", "sections": ["回路", "回路と電流・電圧"], "workbook_page": "180-183"}, {"no": 27, "title": "電圧と電流の関係", "sections": ["電圧と電流の関係"], "workbook_page": "186-189"}, {"no": 28, "title": "電流のはたらきを表す量", "sections": ["電気エネルギー"], "workbook_page": "192-195"}, {"no": 29, "title": "電流の正体", "sections": ["静電気", "電流の正体"], "workbook_page": "200-203"}, {"no": 30, "title": "電流がつくる磁界", "sections": ["電流がつくる磁界", "電流が磁界から受ける力"], "workbook_page": "204-207"}, {"no": 31, "title": "発電機のしくみ", "sections": ["電磁誘導と発電", "直流と交流"], "workbook_page": "208-211"}]}, {"other": "元素周期表", "workbook_page": "232"}]};
        const VIEW = "jhs_iwork_science2_viewer.html?book=jhs_iwork_science2";
        /** 解答解説先頭 global=234 → 233 + 解答書（印刷＝PDF）p */
        const MAIN_ANSWER_BOOK_OFFSET = 233;
        const OMITTED_PRINTED_ANSWER_PAGES = 0;
        /** jhs_data main_answers のページ数（234〜307） */
        const MAIN_ANSWER_PDF_PAGES = 74;
        const PLUS = { base: 308, len: 94 };
        const PLUS_ANS = { base: 402, len: 25 };

        function parseWorkbookStart(range) {
            const s = String(range || "");
            return parseInt((s.split("-")[0] || "").trim(), 10);
        }
        function pageSpan(range) {
            const p = String(range || "").split("-").map(x => parseInt(x.trim(), 10));
            const a = p[0];
            const b = p.length > 1 && !isNaN(p[1]) ? p[1] : a;
            if (isNaN(a)) return 0;
            return Math.max(1, b - a + 1);
        }
        function toGlobalPage(workbookStart) {
            return workbookStart + 1;
        }

        function flattenRows() {
            const rows = [];
            tocSource.contents.forEach(block => {
                if (block.unit && block.chapters) {
                    block.chapters.forEach(ch => {
                        rows.push({
                            unit: block.unit,
                            no: ch.no,
                            title: ch.title,
                            sections: ch.sections,
                            workbook_page: ch.workbook_page,
                            weight: pageSpan(ch.workbook_page)
                        });
                    });
                } else if (block.other) {
                    rows.push({
                        unit: "（本冊末尾）",
                        no: "資料",
                        title: block.other,
                        sections: null,
                        workbook_page: block.workbook_page,
                        weight: pageSpan(block.workbook_page)
                    });
                }
            });
            return rows;
        }

        function assignJumpPages(rows, baseGlobal, segmentLen) {
            const totalW = rows.reduce((s, r) => s + r.weight, 0) || 1;
            let cum = 0;
            const out = rows.map(r => {
                const jump = baseGlobal + Math.floor(segmentLen * cum / totalW);
                cum += r.weight;
                return Object.assign({}, r, { jumpPage: jump });
            });
            out.forEach((r, i) => {
                const next = out[i + 1];
                r.endPage = next ? next.jumpPage - 1 : baseGlobal + segmentLen - 1;
                if (r.endPage < r.jumpPage) r.endPage = r.jumpPage;
            });
            return out;
        }

        function groupByUnit(rows) {
            const groups = [];
            let cur = null;
            rows.forEach(r => {
                if (!cur || cur.unit !== r.unit) {
                    cur = { unit: r.unit, chapters: [] };
                    groups.push(cur);
                }
                cur.chapters.push(r);
            });
            return groups;
        }

        function renderMainWork(groups) {
            const host = document.getElementById("toc-dynamic");
            groups.forEach(group => {
                const block = document.createElement("div");
                block.className = "toc-unit-block";
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>${group.unit}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                group.chapters.forEach(ch => {
                    const wbStart = parseWorkbookStart(ch.workbook_page);
                    if (!wbStart) return;
                    const gp = toGlobalPage(wbStart);
                    const wrap = document.createElement("div");
                    wrap.className = "toc-chapter";
                    wrap.innerHTML = `<a href="${VIEW}&section=main&page=${gp}" class="toc-chapter-link"><span class="toc-chapter-title">${ch.no}. ${ch.title}</span><span class="toc-chapter-pages">p.${ch.workbook_page}</span></a>`;
                    if (ch.sections && ch.sections.length) {
                        const subs = document.createElement("div");
                        subs.className = "toc-subsections";
                        ch.sections.forEach((sec, i) => {
                            const a = document.createElement("a");
                            a.className = "toc-sub-link";
                            a.href = `${VIEW}&section=main&page=${gp}`;
                            a.innerHTML = `<span class="toc-sub-num">${ch.no}.${i + 1}</span><span class="toc-sub-title">${sec}</span><span class="toc-sub-page">p.${ch.workbook_page}</span>`;
                            subs.appendChild(a);
                        });
                        wrap.appendChild(subs);
                    }
                    body.appendChild(wrap);
                });
                block.appendChild(body);
                host.appendChild(block);
            });
        }

        function renderJumpGroups(containerId, groups, sectionId) {
            const host = document.getElementById(containerId);
            groups.forEach(group => {
                const block = document.createElement("div");
                block.className = "toc-unit-block";
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>${group.unit}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                group.chapters.forEach(ch => {
                    const wrap = document.createElement("div");
                    wrap.className = "toc-chapter";
                    const rangeLabel = ch.jumpPage === ch.endPage ? `p.${ch.jumpPage}` : `p.${ch.jumpPage}-${ch.endPage}`;
                    wrap.innerHTML = `<a href="${VIEW}&section=${sectionId}&page=${ch.jumpPage}" class="toc-chapter-link"><span class="toc-chapter-title">${ch.no}. ${ch.title}</span><span class="toc-chapter-pages">${rangeLabel}</span></a>`;
                    body.appendChild(wrap);
                });
                block.appendChild(body);
                host.appendChild(block);
            });
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function stripCite(s) {
            return String(s).replace(/\s*\[cite:[^\]]*\]/g, "").trim();
        }

        function printedAnswerPageToViewer(printed) {
            const p = Number(printed);
            if (!Number.isFinite(p) || p < 1) {
                return { pdfPage: null, globalP: null, omitted: true, clamped: false };
            }
            if (p <= OMITTED_PRINTED_ANSWER_PAGES) {
                return { pdfPage: null, globalP: null, omitted: true, clamped: false };
            }
            let pdf = p - OMITTED_PRINTED_ANSWER_PAGES;
            let clamped = false;
            if (pdf > MAIN_ANSWER_PDF_PAGES) {
                pdf = MAIN_ANSWER_PDF_PAGES;
                clamped = true;
            }
            return {
                pdfPage: pdf,
                globalP: MAIN_ANSWER_BOOK_OFFSET + pdf,
                omitted: false,
                clamped
            };
        }

        function buildAnswerRow(page, label) {
            const { pdfPage, globalP, omitted, clamped } = printedAnswerPageToViewer(page);
            const wrap = document.createElement("div");
            wrap.className = "toc-chapter toc-answer-item" + (omitted ? " toc-answer-omitted" : "");
            let rightCol;
            if (omitted) {
                rightCol =
                    `<span class="toc-chapter-pages">` +
                    `<span>解答（印刷）p.${page}</span>` +
                    `<span class="toc-global-p">全体 ―</span>` +
                    `<span class="toc-answer-note">ページ番号が無効です</span>` +
                    `</span>`;
                wrap.innerHTML =
                    `<div class="toc-chapter-link">` +
                    `<span class="toc-chapter-title">${escapeHtml(label)}</span>${rightCol}` +
                    `</div>`;
            } else {
                const clampNote = clamped
                    ? `<span class="toc-answer-note">PDFは${MAIN_ANSWER_PDF_PAGES}ページまで（末尾に合わせて表示）</span>`
                    : "";
                rightCol =
                    `<span class="toc-chapter-pages">` +
                    `<span>解答（印刷）p.${page}</span>` +
                    `<span class="toc-global-p">PDF p.${pdfPage} · 全体 p.${globalP}</span>` +
                    clampNote +
                    `</span>`;
                wrap.innerHTML =
                    `<a href="${VIEW}&section=main_answers&page=${globalP}" class="toc-chapter-link">` +
                    `<span class="toc-chapter-title">${escapeHtml(label)}</span>${rightCol}` +
                    `</a>`;
            }
            return wrap;
        }

        function renderAnswerAccordion(hostId, groups) {
            const host = document.getElementById(hostId);
            if (!host) return;
            host.innerHTML = "";
            groups.forEach(group => {
                const block = document.createElement("div");
                block.className = "toc-unit-block";
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>${escapeHtml(group.unit)}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                group.items.forEach(item => body.appendChild(buildAnswerRow(item.page, item.label)));
                block.appendChild(body);
                host.appendChild(block);
            });
        }

        function renderMainAnswerBookFromData(data) {
            if (!data || !data.contents) return;
            const groups = [];
            let cur = null;
            data.contents.forEach(block => {
                const unit = block.unit ? stripCite(block.unit) : null;
                if (unit && (!cur || cur.unit !== unit)) {
                    cur = { unit, items: [] };
                    groups.push(cur);
                }
                if (!cur) {
                    cur = { unit: "その他", items: [] };
                    groups.push(cur);
                }
                if (Array.isArray(block.sections)) {
                    block.sections.forEach(sec => {
                        const page = typeof sec.page === "number" && !Number.isNaN(sec.page) ? sec.page : block.page;
                        cur.items.push({ page, label: stripCite(sec.name || sec.title || "") });
                    });
                } else if (block.section) {
                    cur.items.push({ page: block.page, label: stripCite(block.section) });
                }
            });
            renderAnswerAccordion("toc-main-answers", groups);
        }

        const flat = flattenRows();
        const plusRows = assignJumpPages(flat, PLUS.base, PLUS.len);
        const plusAnsRows = assignJumpPages(flat, PLUS_ANS.base, PLUS_ANS.len);

        renderMainWork(groupByUnit(flat));

        renderJumpGroups("toc-plus", groupByUnit(plusRows), "plus");
        renderJumpGroups("toc-plus-answers", groupByUnit(plusAnsRows), "plus_answers");

        fetch("data/jhs_iwork_science2_main_answer_toc.json")
            .then(r => {
                if (!r.ok) throw new Error("fetch failed");
                return r.json();
            })
            .then(renderMainAnswerBookFromData)
            .catch(() => {
                const el = document.getElementById("toc-main-answers");
                if (el) {
                    el.innerHTML = "<p class=\"toc-section-note\">解答目次データ（data/jhs_iwork_science2_main_answer_toc.json）を読み込めませんでした。Webサーバ経由で開いているか確認してください。</p>";
                }
            });
    </script>
