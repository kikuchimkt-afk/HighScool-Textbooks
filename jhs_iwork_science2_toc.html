    <script>
        const tocSource = {"contents": [{"unit": "1年の復習", "chapters": [{"no": 1, "title": "いろいろな生物とその共通点", "workbook_page": "4-7"}, {"no": 2, "title": "活きている地球", "workbook_page": "8-11"}, {"no": 3, "title": "身のまわりの物質", "workbook_page": "12-15"}, {"no": 4, "title": "光・音・力による現象", "workbook_page": "16-19"}]}, {"unit": "生命（生物の体のつくりとはたらき）", "chapters": [{"no": 5, "title": "生物の体をつくるもの", "sections": ["生物と細胞"], "workbook_page": "20-23"}, {"no": 6, "title": "光合成と呼吸", "sections": ["光合成", "光合成と呼吸"], "workbook_page": "24-27"}, {"no": 7, "title": "根と茎のつくり", "sections": ["根と茎のつくりとはたらき"], "workbook_page": "30-33"}, {"no": 8, "title": "葉のつくりとはたらき", "sections": ["葉の細胞のつくり", "吸い上げた水のゆくえ"], "workbook_page": "34-37"}, {"no": 9, "title": "栄養分をとり入れるしくみ", "sections": ["栄養分をとり入れるしくみ"], "workbook_page": "40-43"}, {"no": 10, "title": "動物の呼吸", "sections": ["呼吸と排出", "物質を運ぶしくみ"], "workbook_page": "44-47"}, {"no": 11, "title": "動物の行動のしくみ", "sections": ["感覚器官", "神経系", "運動器官"], "workbook_page": "48-51"}]}, {"unit": "地球（地球の大気と天気の変化）", "chapters": [{"no": 12, "title": "大気の中ではたらく力", "sections": ["圧力", "大気圧"], "workbook_page": "72-75"}, {"no": 13, "title": "気象観測", "sections": ["大気のようす"], "workbook_page": "76-79"}, {"no": 14, "title": "雲のでき方", "sections": ["大気中の水の変化"], "workbook_page": "82-85"}, {"no": 15, "title": "空気中にふくまれる水蒸気の量", "sections": ["空気中にふくまれる水蒸気の量", "空気の湿りけ"], "workbook_page": "86-89"}, {"no": 16, "title": "気圧配置と天気の変化", "sections": ["風がふくしくみ", "気団と前線", "日本付近の低気圧と前線"], "workbook_page": "94-97"}, {"no": 17, "title": "大気の動き", "sections": ["前線の通過と天気の変化", "地球規模での大気の動き"], "workbook_page": "98-101"}, {"no": 18, "title": "日本の天気", "sections": ["陸と海の間の大気の動き", "日本の四季の天気"], "workbook_page": "104-107"}]}, {"unit": "物質（化学変化と原子・分子）", "chapters": [{"no": 19, "title": "物質の分解", "sections": ["物質を加熱したときの変化", "水溶液に電流を流したときの変化"], "workbook_page": "124-127"}, {"no": 20, "title": "物質の成り立ち", "sections": ["物質のもとになる粒子", "物質を表す記号"], "workbook_page": "128-131"}, {"no": 21, "title": "物質どうしが結びつく変化", "sections": ["物質どうしが結びつく変化"], "workbook_page": "136-139"}, {"no": 22, "title": "酸化と還元", "sections": ["物質が酸素と結びつく変化", "酸化物から酸素をとり除く変化"], "workbook_page": "140-143"}, {"no": 23, "title": "化学変化と熱の出入り", "sections": ["化学変化と熱の出入り"], "workbook_page": "144-147"}, {"no": 24, "title": "化学変化の前後の物質の質量", "sections": ["化学変化の前後の物質の質量"], "workbook_page": "152-155"}, {"no": 25, "title": "反応する物質どうしの質量の割合", "sections": ["反応する物質どうしの質量の割合"], "workbook_page": "156-159"}]}, {"unit": "エネルギー（電流とその利用）", "chapters": [{"no": 26, "title": "回路と電流・電圧", "sections": ["回路", "回路と電流・電圧"], "workbook_page": "180-183"}, {"no": 27, "title": "電圧と電流の関係", "sections": ["電圧と電流の関係"], "workbook_page": "186-189"}, {"no": 28, "title": "電流のはたらきを表す量", "sections": ["電気エネルギー"], "workbook_page": "192-195"}, {"no": 29, "title": "電流の正体", "sections": ["静電気", "電流の正体"], "workbook_page": "200-203"}, {"no": 30, "title": "電流がつくる磁界", "sections": ["電流がつくる磁界", "電流が磁界から受ける力"], "workbook_page": "204-207"}, {"no": 31, "title": "発電機のしくみ", "sections": ["電磁誘導と発電", "直流と交流"], "workbook_page": "208-211"}]}, {"other": "元素周期表", "workbook_page": "232"}]};
        function parseWorkbookStart(range) { const s = String(range || ""); return parseInt((s.split("-")[0] || "").trim(), 10); }
        function toGlobalPage(workbookStart) { return workbookStart + 1; }
        const host = document.getElementById("toc-dynamic");
        tocSource.contents.forEach((item, unitIndex) => {
            if (item.unit) {
                const block = document.createElement("div");
                block.className = "toc-unit-block" + (unitIndex < 2 ? " open" : "");
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>${item.unit}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                item.chapters.forEach((ch) => {
                    const wbStart = parseWorkbookStart(ch.workbook_page);
                    if (!wbStart) return;
                    const gp = toGlobalPage(wbStart);
                    const wrap = document.createElement("div");
                    wrap.className = "toc-chapter";
                    wrap.innerHTML = `<a href="jhs_iwork_science2_viewer.html?book=jhs_iwork_science2&section=main&page=${gp}" class="toc-chapter-link"><span class="toc-chapter-title">${ch.no}. ${ch.title}</span><span class="toc-chapter-pages">p.${ch.workbook_page}</span></a>`;
                    if (ch.sections && ch.sections.length) {
                        const subs = document.createElement("div");
                        subs.className = "toc-subsections";
                        ch.sections.forEach((sec, i) => {
                            const a = document.createElement("a");
                            a.className = "toc-sub-link";
                            a.href = `jhs_iwork_science2_viewer.html?book=jhs_iwork_science2&section=main&page=${gp}`;
                            a.innerHTML = `<span class="toc-sub-num">${ch.no}.${i + 1}</span><span class="toc-sub-title">${sec}</span><span class="toc-sub-page">p.${ch.workbook_page}</span>`;
                            subs.appendChild(a);
                        });
                        wrap.appendChild(subs);
                    }
                    body.appendChild(wrap);
                });
                block.appendChild(body);
                host.appendChild(block);
            } else if (item.other) {
                const wbStart = parseWorkbookStart(item.workbook_page);
                const gp = toGlobalPage(wbStart);
                const wrap = document.createElement("div");
                wrap.className = "toc-chapter";
                wrap.innerHTML = `<a href="jhs_iwork_science2_viewer.html?book=jhs_iwork_science2&section=main&page=${gp}" class="toc-chapter-link"><span class="toc-chapter-title">${item.other}</span><span class="toc-chapter-pages">p.${item.workbook_page}</span></a>`;
                host.appendChild(wrap);
            }
        });
    </script>
