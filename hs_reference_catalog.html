<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校参考書一覧（表紙ノートリミング）</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: #0a0a12;
            min-height: 100vh;
            color: #e8e8ed;
        }
        .bg-layer { position: fixed; inset: 0; z-index: 0; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(1.1); }
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.75));
        }
        .wrap { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
        .nav-top {
            margin-bottom: 1.5rem;
        }
        .nav-top a {
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            font-size: 0.88rem;
        }
        .nav-top a:hover { color: rgba(255,255,255,0.85); }
        h1 {
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }
        .sub {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.38);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .tabs {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            padding: 0.45rem 1.1rem;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.55);
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab-btn.active {
            background: rgba(255,255,255,0.14);
            color: #fff;
            border-color: rgba(255,255,255,0.28);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.15);
        }
        .card a { text-decoration: none; color: inherit; display: block; }
        /* 表紙ノートリミング: 枠内に表紙全体を収める */
        .cover-frame {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-frame img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
        }
        .card-body { padding: 0.85rem 1rem 1.1rem; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.35rem; line-height: 1.35; }
        .card-desc { font-size: 0.72rem; color: rgba(255,255,255,0.38); line-height: 1.45; }
        .card-cat {
            font-size: 0.65rem;
            color: rgba(160, 200, 255, 0.75);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        @media (max-width: 520px) {
            .cover-frame { height: 260px; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"><img src="images/portal_bg.png" alt="" loading="eager"></div>
    <div class="bg-overlay"></div>
    <div class="wrap">
        <div class="nav-top">
            <a href="index.html">← ポータルに戻る</a>
        </div>
        <h1>高校参考書一覧</h1>
        <p class="sub">表紙画像はトリミングせず、枠内に全体が入るように表示しています（<code style="font-size:0.8em;opacity:0.7">object-fit: contain</code>）。</p>

        <div class="tabs" id="tabs">
            <button type="button" class="tab-btn active" data-cat="all">すべて</button>
            <button type="button" class="tab-btn" data-cat="eng">英語</button>
            <button type="button" class="tab-btn" data-cat="math">数学</button>
            <button type="button" class="tab-btn" data-cat="chem">化学</button>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const CAT_LABEL = { eng: '英語', math: '数学', chem: '化学' };
        const books = [
            { id: 'random_check_standard', cat: 'eng', title: 'ランダム総点検 英文法・語法 標準レベル編', desc: '英文法・語法の最終チェック問題集', cover: 'images/random_check_standard_cover.jpg', toc: 'random_check_standard_toc.html' },
            { id: 'random_check_basic', cat: 'eng', title: 'ランダム総点検 英文法・語法 基礎レベル編', desc: '英文法・語法の最終チェック問題集', cover: 'images/random_check_basic_cover.jpg', toc: 'random_check_basic_toc.html' },
            { id: 'tanki_math1a', cat: 'math', title: '短期集中ゼミ 基礎からの数学I+A', desc: '基礎から学べる短期完成問題集', cover: 'images/tanki_math1a_cover.jpg', toc: 'tanki_math1a_toc.html' },
            { id: 'tanki_math2b', cat: 'math', title: '短期集中ゼミ 基礎からの数学II+B', desc: '基礎から学べる短期完成問題集', cover: 'images/tanki_math2b_cover.jpg', toc: 'tanki_math2b_toc.html' },
            { id: 'superquick_math1a', cat: 'math', title: 'SuperQuick 数IA', desc: '入試に必要な内容を厳選したスーパー問題集', cover: 'images/superquick_math1a_cover.jpg', toc: 'superquick_math1a_toc.html' },
            { id: 'sundai_math1a', cat: 'math', title: '短期攻略 共通テスト数学Ⅰ・A', desc: '共通テスト特有の思考力・判断力を効率よく鍛える', cover: 'images/sundai_math1a_cover.jpg', toc: 'sundai_math1a_toc.html' },
            { id: 'sundai_math2bc', cat: 'math', title: '短期攻略 共通テスト数学II・B・C', desc: '共通テスト特有の思考力・判断力を効率よく鍛える', cover: 'images/sundai_math2bc_cover.jpg', toc: 'sundai_math2bc_toc.html' },
            { id: 'chart_kyotsu_math', cat: 'math', title: '新課程 チャート式 大学入学共通テスト対策 数学IA+IIBC', desc: '共通テスト対策向けの網羅型問題集', cover: 'images/chart_kyotsu_math_cover.jpg', toc: 'chart_kyotsu_math_toc.html' },
            { id: 'superquick_math2bc', cat: 'math', title: 'SuperQuick 数IIBC', desc: '数II・数B・数Cの入試問題集（全197項目）', cover: 'images/superquick_math2bc_cover.jpg', toc: 'superquick_math2bc_toc.html' },
            { id: 'speedcheck_chem', cat: 'chem', title: 'スピードチェック 理論化学', desc: '99の最重要ポイントで理論化学を完全攻略', cover: 'images/speedcheck_chem_cover.jpg', toc: 'speedcheck_chem_toc.html' },
            { id: 'speedcheck_chem_basic', cat: 'chem', title: 'スピードチェック 化学基礎', desc: '57の最重要ポイントで化学基礎を完全攻略', cover: 'images/speedcheck_chem_basic_cover.jpg', toc: 'speedcheck_chem_basic_toc.html' },
            { id: 'leadlight_chem', cat: 'chem', title: 'リードLightノート 化学基礎 (新課程)', desc: '基礎知識の整理と定着に最適な書き込み式ノート', cover: 'images/leadlight_chem_cover.jpg', toc: 'leadlight_chem_toc.html' },
            { id: 'leadlight_chem_adv', cat: 'chem', title: 'リードLightノート 化学 (新課程)', desc: '理系化学の基礎から標準までを網羅する問題集', cover: 'images/leadlight_chem_adv_cover.jpg', toc: 'leadlight_chem_adv_toc.html' },
            { id: 'excel_chem', cat: 'chem', title: 'エクセル化学 総合版 (新課程)', desc: '高校化学・化学基礎を完全網羅した総合問題集', cover: 'images/excel_chem_cover.jpg', toc: 'excel_chem_toc.html' },
            { id: 'chart_chem', cat: 'chem', title: 'チャート式 新化学 (新課程)', desc: '網羅型でわかりやすい化学の決定版。辞書代わりに使える最強の参考書', cover: 'images/chart_chem_cover.jpg', toc: 'chart_chem_toc.html' },
            { id: 'canpass_chem', cat: 'chem', title: '国公立標準問題集 CanPass化学', desc: '国公立大の記述式問題対策に最適な良問集', cover: 'images/canpass_chem_cover.jpg', toc: 'canpass_chem_toc.html' },
            { id: 'rikeishiyasui_chem', cat: 'chem', title: '理解しやすい化学・化学基礎', desc: '化学のすべてがわかる充実の読み物', cover: 'images/rikeishiyasui_chem_cover.jpg', toc: 'rikeishiyasui_chem_toc.html' },
            { id: 'kagaku_zuroku', cat: 'chem', title: '化学図録', desc: '写真・図解で化学を視覚的に理解する資料集', cover: 'images/kagaku_zuroku_cover.jpg', toc: 'kagaku_zuroku_toc.html' },
            { id: 'hyojun_chem', cat: 'chem', title: '化学の新標準演習 (新課程)', desc: '基礎から応用まで網羅する標準問題集', cover: 'images/hyojun_chem_cover.jpg', toc: 'hyojun_chem_toc.html' },
            { id: 'shinkenkyu_chem', cat: 'chem', title: '化学の新研究 改訂版', desc: '理系化学の参考書（佑教出版）', cover: 'images/shinkenkyu_chem_cover.jpg', toc: 'shinkenkyu_chem_toc.html' },
            { id: 'polaris1', cat: 'eng', title: '英語長文ポラリス1', desc: '大学入試対応の英語長文読解問題集', cover: 'images/polaris1_cover.jpg', toc: 'polaris1_toc.html' },
            { id: 'polaris2', cat: 'eng', title: '英語長文ポラリス2', desc: '標準レベルの英語長文読解問題集', cover: 'images/polaris2_cover.jpg', toc: 'polaris2_toc.html' },
            { id: 'rules1', cat: 'eng', title: '関正生の英語長文 Rules 1', desc: '入試基礎レベルからの英語長文読解問題集', cover: 'images/rules1_cover.jpg', toc: 'rules1_toc.html' },
            { id: 'rules2', cat: 'eng', title: '関正生の英語長文 Rules 2', desc: '共通テストレベルの英語長文読解問題集', cover: 'images/rules2_cover.jpg', toc: 'rules2_toc.html' },
            { id: 'rules3', cat: 'eng', title: '関正生の英語長文 Rules 3', desc: '入試標準〜難関レベルの英語長文読解問題集', cover: 'images/rules3_cover.jpg', toc: 'rules3_toc.html' },
            { id: 'solution1', cat: 'eng', title: '肘井学の読解のための英文法 Solution 1', desc: '英語長文読解のための基礎英文法', cover: 'images/solution1_cover.jpg', toc: 'solution1_toc.html' },
            { id: 'solution2', cat: 'eng', title: '肘井学の読解のための英文法 Solution 2', desc: '英語長文読解のための標準英文法', cover: 'images/solution2_cover.jpg', toc: 'solution2_toc.html' },
            { id: 'solution3', cat: 'eng', title: '肘井学の読解のための英文法 Solution 3', desc: '英語長文読解のための最新テーマ別難関英文法', cover: 'images/solution3_cover.jpg', toc: 'solution3_toc.html' },
            { id: 'kawai_300', cat: 'eng', title: 'やっておきたい英語長文300', desc: '英語長文の基礎固めから標準レベルまでの必須30題', cover: 'images/kawai_300_cover.jpg', toc: 'kawai_300_toc.html' },
            { id: 'kawai_500', cat: 'eng', title: 'やっておきたい英語長文500', desc: '中堅から難関私大レベルの英語長文ドリル20題', cover: 'images/kawai_500_cover.jpg', toc: 'kawai_500_toc.html' },
            { id: 'kawai_700', cat: 'eng', title: 'やっておきたい英語長文700', desc: '難関私大から国公立二次試験レベルの長文演習15題', cover: 'images/kawai_700_cover.jpg', toc: 'kawai_700_toc.html' },
            { id: 'kawai_1000', cat: 'eng', title: 'やっておきたい英語長文1000', desc: '最難関大レベルの超長文本格演習10題', cover: 'images/kawai_1000_cover.jpg', toc: 'kawai_1000_toc.html' },
            { id: 'jyuko_jo', cat: 'eng', title: '英文熟考［改訂版］上', desc: '読解のための基礎と文法構造', cover: 'images/jyuko_jo_cover.jpg', toc: 'jyuko_jo_toc.html' },
            { id: 'jyuko_ge', cat: 'eng', title: '英文熟考［改訂版］下', desc: '読解のための発展と文法構造', cover: 'images/jyuko_ge_cover.jpg', toc: 'jyuko_ge_toc.html' },
            { id: 'hijii_dokkai', cat: 'eng', title: '読解のための英文法が面白いほどわかる本', desc: '英文解釈の基礎と構文の発見をマスター', cover: 'images/hijii_dokkai_cover.jpg', toc: 'hijii_dokkai_toc.html' },
            { id: 'hijii_zero', cat: 'eng', title: 'ゼロから英語長文が面白いほどわかる本', desc: '基礎〜応用レベルの英語長文読解問題集', cover: 'images/hijii_zero_cover.jpg', toc: 'hijii_zero_toc.html' },
            { id: 'engage_egrammar', cat: 'eng', title: '英文法・語法 Engage', desc: '文法・語法から頻出ランキングまで一冊で学ぶ', cover: 'images/engage_egrammar_cover.jpg', toc: 'engage_egrammar_toc.html' }
        ];

        const grid = document.getElementById('grid');

        function render(cat) {
            const list = cat === 'all' ? books : books.filter(b => b.cat === cat);
            grid.innerHTML = '';
            list.forEach((book) => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <a href="${book.toc}">
                        <div class="cover-frame">
                            <img src="${book.cover}" alt="" loading="lazy" onerror="this.style.opacity=0.25;this.alt='表紙なし';">
                        </div>
                        <div class="card-body">
                            <div class="card-cat">${CAT_LABEL[book.cat]}</div>
                            <div class="card-title">${book.title}</div>
                            <div class="card-desc">${book.desc}</div>
                        </div>
                    </a>`;
                grid.appendChild(card);
            });
        }

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                render(btn.dataset.cat);
            });
        });

        render('all');
    </script>
</body>
</html>
