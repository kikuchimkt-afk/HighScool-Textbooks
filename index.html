<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校参考書 ビューア ポータル</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            margin-top: 5rem;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .library-grid {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
            padding: 0 2rem;
        }
        .book-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            overflow: hidden;
            min-height: 260px;
        }
        .book-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .book-card-cover {
            width: 100%;
            height: 220px;
            object-fit: contain;
            display: block;
            background: #f0f0f0;
            padding: 10px;
            box-sizing: border-box;
        }
        .book-card-body {
            padding: 1.2rem 1.5rem;
            text-align: center;
        }
        .book-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .book-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .book-desc {
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 高校参考書 電子ビューア</h1>
        <p>教科書・問題集のページイメージ閲覧システム (見開き対応)</p>
    </header>

    <div class="library-grid">
        <a href="superquick_math1a_toc.html" class="book-card">
            <img src="images/superquick_math1a_cover.jpg" alt="SuperQuick 数IA 表紙" class="book-card-cover">
            <div class="book-card-body">
                <div class="book-title">SuperQuick 数IA</div>
                <div class="book-desc">入試に必要な内容を厳選したスーパー問題集</div>
            </div>
        </a>
        <a href="superquick_math2bc_toc.html" class="book-card">
            <img src="images/superquick_math2bc_cover.jpg" alt="SuperQuick 数IIBC 表紙" class="book-card-cover">
            <div class="book-card-body">
                <div class="book-title">SuperQuick 数IIBC</div>
                <div class="book-desc">数II・数B・数Cの入試問題集（全197項目）</div>
            </div>
        </a>
        <a href="speedcheck_chem_toc.html" class="book-card">
            <img src="images/speedcheck_chem_cover.jpg" alt="スピードチェック 理論化学 表紙" class="book-card-cover">
            <div class="book-card-body">
                <div class="book-title">スピードチェック 理論化学</div>
                <div class="book-desc">99の最重要ポイントで理論化学を完全攻略</div>
            </div>
        </a>
    </div>
</body>
</html>
