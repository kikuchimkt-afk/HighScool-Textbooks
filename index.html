<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校参考書 ビューア ポータル</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh; color: #fff;
            display: flex; flex-direction: column; align-items: center;
        }

        /* === Password Gate === */
        .gate-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .gate-box {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            padding: 3rem 2.5rem; text-align: center; max-width: 400px; width: 90%;
        }
        .gate-box h2 { margin: 0 0 0.5rem; font-size: 1.6rem; }
        .gate-box p { opacity: 0.7; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .gate-input {
            width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.2); color: #fff; font-size: 1.1rem; text-align: center;
            outline: none; margin-bottom: 1rem;
        }
        .gate-input::placeholder { color: rgba(255,255,255,0.4); }
        .gate-input:focus { border-color: #4facfe; }
        .gate-btn {
            width: 100%; padding: 0.8rem; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4facfe, #00f2fe); color: #1a1a2e;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .gate-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79,172,254,0.4); }
        .gate-error { color: #ff6b6b; margin-top: 0.8rem; font-size: 0.9rem; display: none; }

        /* === Portal === */
        .portal-content { display: none; width: 100%; }
        .portal-content.visible { display: flex; flex-direction: column; align-items: center; }
        .header { margin-top: 3rem; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { font-size: 1.1rem; opacity: 0.8; }
        .library-grid {
            margin-top: 2rem; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem; width: 100%; max-width: 1100px; padding: 0 2rem 4rem;
        }
        .book-card {
            background: rgba(255,255,255,0.1); border-radius: 16px;
            display: flex; flex-direction: column; align-items: stretch;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); overflow: hidden; min-height: 260px;
        }
        .book-card:hover {
            transform: translateY(-5px); background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .book-card-link { text-decoration: none; color: #fff; }
        .book-card-cover {
            width: 100%; height: 220px; object-fit: contain;
            display: block; background: #f0f0f0; padding: 10px;
        }
        .book-card-body { padding: 1rem 1.2rem; text-align: center; }
        .book-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
        .book-desc { font-size: 0.85rem; opacity: 0.7; line-height: 1.4; }
        .book-card-actions {
            padding: 0 1rem 1rem; display: flex; gap: 8px; justify-content: center;
        }
        .btn-qr {
            padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px; background: rgba(255,255,255,0.1);
            color: #fff; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-qr:hover { background: rgba(255,255,255,0.25); border-color: #4facfe; }

        /* === QR Modal === */
        .qr-modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
        }
        .qr-modal-overlay.active { display: flex; }
        .qr-modal {
            background: #fff; border-radius: 20px; padding: 2rem;
            max-width: 420px; width: 90%; text-align: center; color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .qr-modal h3 { margin: 0 0 0.5rem; font-size: 1.2rem; color: #1a1a2e; }
        .qr-modal .qr-subtitle { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
        .qr-modal img { display: block; margin: 0 auto 1rem; border-radius: 8px; }
        .qr-url-box {
            background: #f5f5f5; border: 1px solid #ddd; border-radius: 10px;
            padding: 0.6rem 1rem; font-size: 0.8rem; word-break: break-all;
            color: #333; margin-bottom: 1rem; text-align: left; font-family: monospace;
        }
        .qr-actions { display: flex; gap: 8px; justify-content: center; }
        .qr-actions button {
            padding: 0.6rem 1.2rem; border: none; border-radius: 10px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-copy { background: #4facfe; color: #fff; }
        .btn-copy:hover { background: #3a9bf0; }
        .btn-close-qr { background: #e0e0e0; color: #555; }
        .btn-close-qr:hover { background: #ccc; }
        .copy-toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 0.7rem 1.5rem; border-radius: 10px;
            font-size: 0.9rem; z-index: 2000; display: none; animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(10px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 85%{opacity:1} 100%{opacity:0} }

        /* === Logout === */
        .logout-btn {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6); border-radius: 8px; padding: 0.4rem 0.8rem;
            font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(255,0,0,0.2); color: #ff6b6b; border-color: #ff6b6b; }
    </style>
</head>
<body>

<!-- パスワードゲート -->
<div class="gate-overlay" id="gate-overlay">
    <div class="gate-box">
        <h2>🔒 管理者ログイン</h2>
        <p>教師用ポータルにアクセスするにはパスワードを入力してください</p>
        <input type="password" class="gate-input" id="gate-input" placeholder="パスワード" autocomplete="off">
        <button class="gate-btn" id="gate-btn">ログイン</button>
        <div class="gate-error" id="gate-error">パスワードが正しくありません</div>
    </div>
</div>

<!-- ポータル本体 -->
<div class="portal-content" id="portal-content">
    <button class="logout-btn" id="logout-btn">🔓 ログアウト</button>
    <header class="header">
        <h1>📚 高校参考書 電子ビューア</h1>
        <p>教科書・問題集のページイメージ閲覧システム (見開き対応)</p>
    </header>

    <div class="library-grid" id="library-grid">
        <!-- JS で動的生成 -->
    </div>
</div>

<!-- QR モーダル -->
<div class="qr-modal-overlay" id="qr-modal-overlay">
    <div class="qr-modal">
        <h3 id="qr-modal-title">書籍名</h3>
        <p class="qr-subtitle">生徒に配布するQRコード / URL</p>
        <img id="qr-modal-img" src="" width="200" height="200" alt="QR Code">
        <div class="qr-url-box" id="qr-modal-url"></div>
        <div class="qr-actions">
            <button class="btn-copy" id="qr-copy-btn">📋 URLをコピー</button>
            <button class="btn-close-qr" id="qr-close-btn">閉じる</button>
        </div>
    </div>
</div>

<div class="copy-toast" id="copy-toast">✅ URLをコピーしました</div>

<script>
(() => {
    // パスワード (簡易的なクライアントサイド保護)
    const PASS_HASH = '55448833';
    const SESSION_KEY = 'hs_portal_auth';

    const gateOverlay = document.getElementById('gate-overlay');
    const gateInput = document.getElementById('gate-input');
    const gateBtn = document.getElementById('gate-btn');
    const gateError = document.getElementById('gate-error');
    const portalContent = document.getElementById('portal-content');
    const logoutBtn = document.getElementById('logout-btn');

    function isAuthed() {
        return sessionStorage.getItem(SESSION_KEY) === 'true';
    }

    function showPortal() {
        gateOverlay.style.display = 'none';
        portalContent.classList.add('visible');
    }

    function showGate() {
        gateOverlay.style.display = 'flex';
        portalContent.classList.remove('visible');
        sessionStorage.removeItem(SESSION_KEY);
    }

    function tryLogin() {
        const val = gateInput.value.trim();
        if (val === PASS_HASH) {
            sessionStorage.setItem(SESSION_KEY, 'true');
            showPortal();
        } else {
            gateError.style.display = 'block';
            gateInput.value = '';
            gateInput.focus();
            setTimeout(() => gateError.style.display = 'none', 2500);
        }
    }

    gateBtn.addEventListener('click', tryLogin);
    gateInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
    logoutBtn.addEventListener('click', showGate);

    if (isAuthed()) {
        showPortal();
    }

    // === 書籍リスト ===
    const books = [
        { id: 'superquick_math1a', title: 'SuperQuick 数IA', desc: '入試に必要な内容を厳選したスーパー問題集', cover: 'images/superquick_math1a_cover.jpg', toc: 'superquick_math1a_toc.html' },
        { id: 'superquick_math2bc', title: 'SuperQuick 数IIBC', desc: '数II・数B・数Cの入試問題集（全197項目）', cover: 'images/superquick_math2bc_cover.jpg', toc: 'superquick_math2bc_toc.html' },
        { id: 'speedcheck_chem', title: 'スピードチェック 理論化学', desc: '99の最重要ポイントで理論化学を完全攻略', cover: 'images/speedcheck_chem_cover.jpg', toc: 'speedcheck_chem_toc.html' },
        { id: 'speedcheck_chem_basic', title: 'スピードチェック 化学基礎', desc: '57の最重要ポイントで化学基礎を完全攻略', cover: 'images/speedcheck_chem_basic_cover.jpg', toc: 'speedcheck_chem_basic_toc.html' },
        { id: 'rikeishiyasui_chem', title: '理解しやすい化学・化学基礎', desc: '化学のすべてがわかる充実の読み物', cover: 'images/rikeishiyasui_chem_cover.jpg', toc: 'rikeishiyasui_chem_toc.html' }
    ];

    const grid = document.getElementById('library-grid');

    books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
            <a href="${book.toc}" class="book-card-link">
                <img src="${book.cover}" alt="${book.title} 表紙" class="book-card-cover">
                <div class="book-card-body">
                    <div class="book-title">${book.title}</div>
                    <div class="book-desc">${book.desc}</div>
                </div>
            </a>
            <div class="book-card-actions">
                <button class="btn-qr" data-toc="${book.toc}" data-title="${book.title}">📱 QR / URL</button>
            </div>
        `;
        grid.appendChild(card);
    });

    // === QR モーダル ===
    const qrOverlay = document.getElementById('qr-modal-overlay');
    const qrTitle = document.getElementById('qr-modal-title');
    const qrImg = document.getElementById('qr-modal-img');
    const qrUrl = document.getElementById('qr-modal-url');
    const qrCopyBtn = document.getElementById('qr-copy-btn');
    const qrCloseBtn = document.getElementById('qr-close-btn');
    const copyToast = document.getElementById('copy-toast');

    let currentQrUrl = '';

    document.querySelectorAll('.btn-qr').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const tocPath = btn.dataset.toc;
            const title = btn.dataset.title;
            const baseUrl = window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
            const fullUrl = baseUrl + tocPath;
            currentQrUrl = fullUrl;

            qrTitle.textContent = title;
            qrUrl.textContent = fullUrl;
            // Google Charts QR API
            qrImg.src = `https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=${encodeURIComponent(fullUrl)}&choe=UTF-8`;
            qrOverlay.classList.add('active');
        });
    });

    qrCloseBtn.addEventListener('click', () => qrOverlay.classList.remove('active'));
    qrOverlay.addEventListener('click', (e) => { if (e.target === qrOverlay) qrOverlay.classList.remove('active'); });

    qrCopyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(currentQrUrl).then(() => {
            copyToast.style.display = 'block';
            setTimeout(() => copyToast.style.display = 'none', 2200);
        }).catch(() => {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = currentQrUrl;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            copyToast.style.display = 'block';
            setTimeout(() => copyToast.style.display = 'none', 2200);
        });
    });
})();
</script>
</body>
</html>
