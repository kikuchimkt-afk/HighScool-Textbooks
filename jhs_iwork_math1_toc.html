<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iワーク 中1数学 | 目次</title>
    <meta name="description" content="iワーク 中1数学 目次一覧（啓林館・未来へひろがる数学1）">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/jhs_iwork_math1_32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/jhs_iwork_math1_180.png">
    <link rel="manifest" href="manifest_jhs_iwork_math1.json">
    <meta name="theme-color" content="#000000">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif; background: #000; min-height: 100vh; color: #f5f5f7; }
        .bg-layer { position: fixed; inset: 0; z-index: 0; }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5) saturate(1.2); }
        .bg-overlay { position: fixed; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.7)); }
        .toc-page { position: relative; z-index: 2; }
        .toc-header { text-align: center; padding: 3rem 1.5rem 1.5rem; }
        .toc-back { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; transition: color 0.25s; font-weight: 400; }
        .toc-back:hover { color: rgba(255,255,255,0.8); }
        .toc-header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.3rem; background: linear-gradient(135deg, #fff, rgba(255,255,255,0.6)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .toc-header .toc-sub { font-size: 0.88rem; color: rgba(255,255,255,0.45); font-weight: 400; max-width: 520px; margin: 0.4rem auto 0; line-height: 1.45; }
        .toc-header p { font-size: 0.9rem; color: rgba(255,255,255,0.35); font-weight: 300; margin-top: 0.35rem; }
        .toc-container { max-width: 760px; margin: 0 auto; padding: 0 1rem 4rem; }
        .toc-cover { display: block; max-width: 180px; margin: 0 auto 2rem; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .toc-chapter { background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .toc-chapter:last-child { border-bottom: none; }
        .toc-chapter-link { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; text-decoration: none; color: #f5f5f7; font-weight: 600; font-size: 0.9rem; }
        .toc-chapter-link:hover { background: rgba(255,255,255,0.06); }
        .toc-chapter-pages { font-size: 0.75rem; color: rgba(255,255,255,0.38); }
        .toc-unit-block { margin-bottom: 0.8rem; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); }
        .toc-unit-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; background: rgba(255,255,255,0.04); color: #f5f5f7; border: none; cursor: pointer; font-size: 0.92rem; font-weight: 700; text-align: left; }
        .toc-unit-toggle:hover { background: rgba(255,255,255,0.09); }
        .toc-unit-arrow { color: rgba(255,255,255,0.65); transition: transform 0.2s; flex-shrink: 0; margin-left: 8px; }
        .toc-unit-block.open .toc-unit-arrow { transform: rotate(90deg); }
        .toc-unit-body { display: none; border-top: 1px solid rgba(255,255,255,0.06); }
        .toc-unit-block.open .toc-unit-body { display: block; }
        .toc-sec-link { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; padding: 0.55rem 1rem; text-decoration: none; color: rgba(255,255,255,0.82); font-size: 0.84rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .toc-sec-link:last-child { border-bottom: none; }
        .toc-sec-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .toc-sec-title { font-weight: 600; }
        .toc-sec-meta { font-size: 0.72rem; color: rgba(255,255,255,0.38); text-align: right; line-height: 1.35; }
        .toc-sec-meta span { display: block; }
        .toc-unit-static { margin: 1.25rem 0 0.5rem; font-size: 0.85rem; color: rgba(200, 190, 255, 0.95); font-weight: 700; }
        .toc-unit-static:first-of-type { margin-top: 0.5rem; }
        .toc-section-note { font-size: 0.72rem; color: rgba(255,255,255,0.32); font-weight: 400; margin: -0.2rem 0 0.6rem; line-height: 1.4; }
        .toc-answer-detail { padding: 0 1rem 0.65rem 1rem; font-size: 0.74rem; color: rgba(255,255,255,0.42); line-height: 1.45; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .toc-chapter.toc-answer-item .toc-chapter-link { align-items: flex-start; }
        .toc-global-p { display: block; font-size: 0.68rem; opacity: 0.88; margin-top: 3px; font-weight: 400; }
        .toc-footer { text-align: center; padding: 2rem 1rem; font-size: 0.7rem; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="bg-layer"><img src="images/portal_bg.png" alt="" loading="eager"></div>
    <div class="bg-overlay"></div>
    <div class="toc-page">
        <div class="toc-header">
            <a href="index.html" class="toc-back">← ポータルに戻る</a>
            <h1>iワーク 中1数学</h1>
            <p class="toc-sub">中学1年 数学 啓林館（未来へひろがる数学1）</p>
            <p>全459ページ</p>
        </div>
        <div class="toc-container">
            <img src="images/jhs_iwork_math1_cover.png" alt="iワーク 中1数学 表紙" class="toc-cover">
            <div class="toc-chapter"><a href="jhs_iwork_math1_viewer.html?book=jhs_iwork_math1&section=cover&page=1" class="toc-chapter-link"><span class="toc-chapter-title">表紙</span><span class="toc-chapter-pages">p.1</span></a></div>

            <div class="toc-unit-static">本冊（ワーク）</div>
            <div id="toc-dynamic"></div>

            <div class="toc-unit-static">本冊 解答解説</div>
            <p class="toc-section-note">解答解説PDFの目次に基づき、見開き先頭のページへジャンプします（解答書のページ番号 → 全体の p.226 からの対応）。</p>
            <div id="toc-main-answers"></div>

            <div class="toc-unit-static">副教材 iワークプラス</div>
            <p class="toc-section-note">副教材も同じ節見出しでジャンプ先を割り当てています（目安）。</p>
            <div id="toc-plus"></div>

            <div class="toc-unit-static">iワークプラス 解答解説</div>
            <p class="toc-section-note">プラス解答はページ数が少ないため、節の先頭付近へのジャンプ（目安）です。</p>
            <div id="toc-plus-answers"></div>
        </div>
        <div class="toc-footer">© 2026 ECCベストワン藍住・北島中央</div>
    </div>
    <script>
        const tocChapters = [
            { chapter_number: 1, chapter_title: "正の数・負の数", sections: [
                { section_number: 1, title: "正の数・負の数", main_pages: "10-15", textbook_pages: "14-22" },
                { section_number: 2, title: "正の数・負の数の加法，減法", main_pages: "16-21", textbook_pages: "24-32" },
                { section_number: 3, title: "正の数・負の数の乗法，除法", main_pages: "22-25", textbook_pages: "33-37" },
                { section_number: 4, title: "乗法と除法の混じった計算", main_pages: "26-29", textbook_pages: "37-41" },
                { section_number: 5, title: "いろいろな計算", main_pages: "30-37", textbook_pages: "42-53" }
            ]},
            { chapter_number: 2, chapter_title: "文字の式", sections: [
                { section_number: 6, title: "文字を使った式", main_pages: "50-57", textbook_pages: "60-68" },
                { section_number: 7, title: "文字式の加法，減法", main_pages: "58-61", textbook_pages: "70-74" },
                { section_number: 8, title: "文字式と数の乗法，除法", main_pages: "62-65", textbook_pages: "75-77" },
                { section_number: 9, title: "関係を表す式", main_pages: "66-69", textbook_pages: "78-83" }
            ]},
            { chapter_number: 3, chapter_title: "方程式", sections: [
                { section_number: 10, title: "方程式とその解", main_pages: "80-83", textbook_pages: "90-95" },
                { section_number: 11, title: "いろいろな方程式", main_pages: "84-89", textbook_pages: "96-100" },
                { section_number: 12, title: "方程式の利用(1)", main_pages: "90-93", textbook_pages: "102-104" },
                { section_number: 13, title: "方程式の利用(2)", main_pages: "94-99", textbook_pages: "105-109" }
            ]},
            { chapter_number: 4, chapter_title: "変化と対応", sections: [
                { section_number: 14, title: "関数・比例", main_pages: "110-115", textbook_pages: "116-123" },
                { section_number: 15, title: "比例のグラフ", main_pages: "116-119", textbook_pages: "124-129" },
                { section_number: 16, title: "反比例", main_pages: "120-123", textbook_pages: "131-138" },
                { section_number: 17, title: "比例，反比例の利用", main_pages: "124-129", textbook_pages: "140-143" }
            ]},
            { chapter_number: 5, chapter_title: "平面図形", sections: [
                { section_number: 18, title: "直線と図形，移動", main_pages: "138-143", textbook_pages: "150-161" },
                { section_number: 19, title: "基本の作図", main_pages: "144-149", textbook_pages: "162-168" },
                { section_number: 20, title: "円とおうぎ形", main_pages: "150-155", textbook_pages: "170-176" }
            ]},
            { chapter_number: 6, chapter_title: "空間図形", sections: [
                { section_number: 21, title: "いろいろな立体", main_pages: "164-169", textbook_pages: "184-192" },
                { section_number: 22, title: "空間内の位置関係", main_pages: "170-175", textbook_pages: "193-202" },
                { section_number: 23, title: "体積・表面積", main_pages: "176-183", textbook_pages: "204-215" }
            ]},
            { chapter_number: 7, chapter_title: "データの活用", sections: [
                { section_number: 24, title: "データの活用", main_pages: "192-199", textbook_pages: "222-243" }
            ]}
        ];

        const VIEW = "jhs_iwork_math1_viewer.html?book=jhs_iwork_math1";
        /** 解答解説ブロック先頭 global=226 に対応する解答書のオフセット（全体 p = 225 + 解答書 p） */
        const MAIN_ANSWER_BOOK_OFFSET = 225;
        const PLUS = { base: 339, len: 77 };
        const PLUS_ANS = { base: 416, len: 44 };

        function parseWorkbookStart(range) {
            const s = String(range || "");
            return parseInt((s.split("-")[0] || "").trim(), 10) || 0;
        }
        function pageSpan(range) {
            const p = String(range || "").split("-").map(x => parseInt(x.trim(), 10));
            const a = p[0];
            const b = p.length > 1 && !isNaN(p[1]) ? p[1] : a;
            if (isNaN(a)) return 0;
            return Math.max(1, b - a + 1);
        }
        function toGlobalPage(workbookStart) {
            return workbookStart + 1;
        }

        function flattenSectionRows() {
            const rows = [];
            tocChapters.forEach(ch => {
                ch.sections.forEach(sec => {
                    rows.push({
                        unit: `第${ch.chapter_number}章　${ch.chapter_title}`,
                        no: sec.section_number,
                        title: sec.title,
                        main_pages: sec.main_pages,
                        textbook_pages: sec.textbook_pages,
                        weight: pageSpan(sec.main_pages)
                    });
                });
            });
            return rows;
        }

        function assignJumpPages(rows, baseGlobal, segmentLen) {
            const totalW = rows.reduce((s, r) => s + r.weight, 0) || 1;
            let cum = 0;
            const out = rows.map(r => {
                const jump = baseGlobal + Math.floor(segmentLen * cum / totalW);
                cum += r.weight;
                return Object.assign({}, r, { jumpPage: jump });
            });
            out.forEach((r, i) => {
                const next = out[i + 1];
                r.endPage = next ? next.jumpPage - 1 : baseGlobal + segmentLen - 1;
                if (r.endPage < r.jumpPage) r.endPage = r.jumpPage;
            });
            return out;
        }

        function groupByUnit(rows) {
            const groups = [];
            let cur = null;
            rows.forEach(r => {
                if (!cur || cur.unit !== r.unit) {
                    cur = { unit: r.unit, chapters: [] };
                    groups.push(cur);
                }
                cur.chapters.push(r);
            });
            return groups;
        }

        function renderMainWork(groups) {
            const host = document.getElementById("toc-dynamic");
            groups.forEach(ch => {
                const block = document.createElement("div");
                block.className = "toc-unit-block";
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>第${ch.chapter_number}章　${ch.chapter_title}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                ch.sections.forEach((sec) => {
                    const wb = parseWorkbookStart(sec.main_pages);
                    if (!wb) return;
                    const gp = toGlobalPage(wb);
                    const a = document.createElement("a");
                    a.className = "toc-sec-link";
                    a.href = `${VIEW}&section=main&page=${gp}`;
                    a.innerHTML = `<span class="toc-sec-title">${sec.section_number}. ${sec.title}</span><span class="toc-sec-meta"><span>本書 p.${sec.main_pages}</span><span>教科書 p.${sec.textbook_pages}</span></span>`;
                    body.appendChild(a);
                });
                block.appendChild(body);
                host.appendChild(block);
            });
        }

        function renderJumpGroups(containerId, groups, sectionId) {
            const host = document.getElementById(containerId);
            groups.forEach(group => {
                const block = document.createElement("div");
                block.className = "toc-unit-block";
                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "toc-unit-toggle";
                toggle.innerHTML = `<span>${group.unit}</span><span class="toc-unit-arrow">▶</span>`;
                toggle.addEventListener("click", () => block.classList.toggle("open"));
                block.appendChild(toggle);
                const body = document.createElement("div");
                body.className = "toc-unit-body";
                group.chapters.forEach(ch => {
                    const wrap = document.createElement("div");
                    wrap.className = "toc-chapter";
                    const rangeLabel = ch.jumpPage === ch.endPage ? `p.${ch.jumpPage}` : `p.${ch.jumpPage}-${ch.endPage}`;
                    wrap.innerHTML = `<a href="${VIEW}&section=${sectionId}&page=${ch.jumpPage}" class="toc-chapter-link"><span class="toc-chapter-title">${ch.no}. ${ch.title}</span><span class="toc-chapter-pages">${rangeLabel}</span></a>`;
                    body.appendChild(wrap);
                });
                block.appendChild(body);
                host.appendChild(block);
            });
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        /** data: { contents: [{ page, section, details? }] } — page は解答解説冊子のページ番号 */
        function renderMainAnswerBookFromData(data) {
            const host = document.getElementById("toc-main-answers");
            if (!host || !data || !data.contents) return;
            host.innerHTML = "";
            data.contents.forEach(item => {
                const globalP = MAIN_ANSWER_BOOK_OFFSET + item.page;
                const wrap = document.createElement("div");
                wrap.className = "toc-chapter toc-answer-item";
                const details = item.details && item.details.length
                    ? `<div class="toc-answer-detail">${item.details.map(escapeHtml).join(" · ")}</div>`
                    : "";
                wrap.innerHTML =
                    `<a href="${VIEW}&section=main_answers&page=${globalP}" class="toc-chapter-link">` +
                    `<span class="toc-chapter-title">${escapeHtml(item.section)}</span>` +
                    `<span class="toc-chapter-pages">` +
                    `<span>解答 p.${item.page}</span>` +
                    `<span class="toc-global-p">全体 p.${globalP}</span>` +
                    `</span></a>${details}`;
                host.appendChild(wrap);
            });
        }

        renderMainWork(tocChapters);

        const flat = flattenSectionRows();
        const plusRows = assignJumpPages(flat, PLUS.base, PLUS.len);
        const plusAnsRows = assignJumpPages(flat, PLUS_ANS.base, PLUS_ANS.len);

        renderJumpGroups("toc-plus", groupByUnit(plusRows), "plus");
        renderJumpGroups("toc-plus-answers", groupByUnit(plusAnsRows), "plus_answers");

        fetch("data/jhs_iwork_math1_main_answer_toc.json")
            .then(r => {
                if (!r.ok) throw new Error("fetch failed");
                return r.json();
            })
            .then(renderMainAnswerBookFromData)
            .catch(() => {
                const host = document.getElementById("toc-main-answers");
                if (host) {
                    host.innerHTML = "<p class=\"toc-section-note\">解答目次データ（data/jhs_iwork_math1_main_answer_toc.json）を読み込めませんでした。Webサーバ経由で開いているか確認してください。</p>";
                }
            });
    </script>
</body>
</html>
