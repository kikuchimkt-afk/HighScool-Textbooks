<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>英文熟考［改訂版］下</title>
    <link rel="manifest" href="manifest_jyuko_ge.json">
    <link rel="apple-touch-icon" href="images/icons/icon-jyuko_ge-192x192.png">
    <link rel="stylesheet" href="css/hs_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js"></script>
</head>
<body>
    <div class="safe-area-top"></div>
    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Main Content Area -->
        <main class="content-area" id="contentArea">
            <div id="viewer" class="pdf-viewer">
                <!-- PDF pages or images will be rendered here -->
            </div>
            <!-- TOC Overlay -->
            <div id="tocOverlay" class="toc-overlay hidden">
                <div class="toc-header">
                    <h2>目次</h2>
                    <button id="closeTocBtn" class="icon-btn"><i class="fas fa-times"></i></button>
                    <!-- Settings Gear -->
                    <button id="settingsBtn2" class="icon-btn" style="position: absolute; right: 60px; top: 15px;"><i class="fas fa-cog"></i></button>
                </div>
                <div class="toc-content" id="tocContent">
                    <!-- TOC items generated via JS -->
                </div>
            </div>
        </main>
        <!-- Bottom Action Bar (Fixed) -->
        <nav class="bottom-nav">
            <div class="page-controls">
                <button id="prevBtn" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="page-info" id="pageInfo">1 / 100</div>
                <button id="nextBtn" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="action-buttons">
                <!-- <button id="settingsBtn" class="icon-btn"><i class="fas fa-cog"></i></button> -->
                <!-- <button id="qrBtn" class="icon-btn"><i class="fas fa-qrcode"></i></button> -->
                <button id="tocBtn" class="icon-btn"><i class="fas fa-list"></i></button>
                <button id="answerBtn" class="icon-btn highlight-btn"><i class="fas fa-book-open"></i></button>
            </div>
        </nav>
    </div>

    <!-- Print Modal -->
    <div id="printModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>印刷設定</h3>
                <button id="closePrintModal" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="print-option">
                    <label>
                        <input type="checkbox" id="printMonochrome" checked> モノクロ印刷 (推奨)
                    </label>
                    <p class="opt-desc">モノクロに最適化された高コントラスト画像を使用します。ファイルサイズも小さくなります。</p>
                </div>
                <div class="print-range-info">
                    現在のセクション: <span id="printSectionName" class="bold">Lesson 1</span><br>
                    印刷予定ページ: <span id="printPageRange" class="bold">p.3 - p.8</span> (<span id="printPageCount" class="bold">6</span>枚)
                </div>
                <div id="printProgressContainer" class="hidden">
                    <p>画像を準備中... <span id="printProgressText">0/6</span></p>
                    <div class="progress-bar"><div class="progress-fill" id="printProgressFill"></div></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="doPrintBtn" class="btn btn-primary"><i class="fas fa-print"></i> 印刷ウィザードを開く</button>
            </div>
        </div>
    </div>


    <script src="js/hs_data.js"></script>
    <script>
        const CURRENT_BOOK_ID = "jyuko_ge";
    </script>
    <script src="js/hs_app.js"></script>
</body>
</html>
